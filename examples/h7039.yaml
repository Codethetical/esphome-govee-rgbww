substitutions:
  name: govee-outdoor-lights
  friendly_name: Outdoor Lights
  # Number of physical bulbs on the string. Each bulb is 2 WS2811 drivers
  # (1 warm-white, 1 RGB), so num_leds below must always be exactly 2x this
  # (the build will fail with a clear error if they don't match).
  num_bulbs: "30"
  num_leds: "60"
  # Data-line GPIO on your replacement ESP32 board.
  data_pin: GPIO16
  # Total power budget for the string, as a fraction of "every LED at full".
  # Minimum 10%. See the light: block below.
  max_power: "100%"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev # replace with whatever matches your specific replacement board
  framework:
    type: esp-idf

# Lets this device load the govee_rgbww component. `source: components` is
# resolved relative to *this YAML file*, so as written this assumes the
# Home Assistant ESPHome add-on layout: a `components/govee_rgbww/` folder
# copied in next to your device YAML (see README's add-on section).
external_components:
  - source: components
    components: [ govee_rgbww ]
  # Alternative: pull the component straight from GitHub instead of a local
  # copy - no manual copying/re-copying needed on updates. The @v0.9.1 tag
  # pins a released version; use @main to track the latest development state
  # instead, accepting that it moves between builds.
  # - source: github://Codethetical/esphome-govee-rgbww@v0.9.1
  #   components: [ govee_rgbww ]

logger:
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
api:
ota:
  platform: esphome

light:
  # Physical layer: the raw WS2811 chain, 2 drivers per bulb. Not exposed to
  # Home Assistant directly - the govee_rgbww light below is what you use.
  - platform: esp32_rmt_led_strip
    id: govee_physical_strip
    internal: true
    pin: ${data_pin}
    chipset: WS2811
    num_leds: ${num_leds}
    rgb_order: RGB # verify against the real string - swap if colors are wrong
    is_rgbw: false

  # Logical layer: what actually shows up in Home Assistant, one RGBW pixel
  # per bulb, with standard ESPHome addressable effects available.
  # Home Assistant sees two mutually exclusive color modes - a color wheel and
  # a color temperature slider. They have to be exclusive: the cool end of the
  # temperature range is the RGB dies driven together, so they cannot show a
  # color at the same time. See "Color and white are separate modes" in the
  # README.
  - platform: govee_rgbww
    # `id:` names the light entity; `output_id:` names this component's own
    # output object, which is what carries set_max_power()/get_load_fraction().
    # The number and sensor below need the latter.
    id: govee_light
    output_id: govee_light_out
    name: None # use the device name as the entity name
    strip_id: govee_physical_strip
    num_bulbs: ${num_bulbs}
    # Which channel of each bulb's white driver the warm white LED hangs off.
    # `red` is confirmed on this string; swap it if white stays dark.
    ww_channel: red
    # No cw_channel: this string has one white LED per bulb, so the cool end of
    # the Kelvin slider is synthesized by driving the bulb's RGB dies together.
    # Set cw_channel only if bring-up shows a second white channel is really
    # wired - see examples/bringup.yaml.
    #
    # cool_white_rgb tints that synthetic white and matches its brightness to
    # the warm LED. Start at the identity below, put the slider at each end in
    # turn, and pull the channels down until cool reads white rather than blue
    # and the two ends look equally bright. Three dies against one warm LED
    # means the starting point will almost certainly be too bright.
    cool_white_rgb: [100%, 100%, 100%]
    # Bounds of the Kelvin slider. With the synthetic cool white the cold end
    # is a label rather than a measurement - the real temperature is whatever
    # the dies and cool_white_rgb produce. Adjust both by eye.
    cold_white_color_temperature: 6500 K
    warm_white_color_temperature: 2700 K
    # Holds white output flat across the temperature slider. With this off the
    # midpoint runs both the warm LED and the synthetic cool white at full, so
    # white peaks in the middle. Defaults to true here, unlike ESPHome's stock
    # cwww/rgbww platforms.
    constant_brightness: true
    # Brightness curve. ESPHome's default of 2.8 makes every step below 100%
    # much dimmer than the stock Govee controller, whose scale is close to
    # linear in PWM duty: measured side by side, 50% on the stock string
    # matched about 75% here. 1.0 tracks the original across the slider; 100%
    # is unchanged either way. Raise it toward 2.8 if you prefer finer control
    # at the dim end over matching the original.
    gamma_correct: 1.0
    # Caps total string draw so full-brightness white can't brown out the
    # supply. This is the value that survives a reboot - the number entity
    # below is only for finding it. Start at 100%, walk it down until the
    # brownout stops, then subtract ~10% for margin.
    max_power: ${max_power}
    # Relative current draw of the warm white LED vs one RGB die. 1.0 assumes
    # they're equal; raise it if white-heavy scenes brown out at budgets that
    # colored scenes survive. The synthetic cool white draws through the RGB
    # driver and is already counted there, so this only describes the warm LED.
    white_weight: 1.0
    # Diagnostic entity reporting the component version, so a device's build
    # can be identified from the Home Assistant UI rather than from its log.
    # Optional - drop this key and no text sensor is created.
    version:
      name: "Component Version"
    effects:
      - addressable_rainbow:
      - addressable_color_wipe:
      - addressable_scan:
      - addressable_twinkle:

# Live tuning for max_power, so finding the brownout threshold is a slider
# drag instead of a flash cycle. Deliberately NOT restore_value: the YAML
# max_power above is the authoritative boot value - otherwise a restored
# number could race the light's own restored state and let one full-power
# frame through before the limit applies. Once you've found your number, put
# it in the substitution above and delete this block.
number:
  - platform: template
    name: "LED Power Limit"
    entity_category: config
    unit_of_measurement: "%"
    min_value: 10
    max_value: 100
    step: 5
    # Reads the component's real budget rather than optimistically echoing
    # the slider, so the displayed value reflects the C++ clamp to >= 10%.
    update_interval: 10s
    lambda: return id(govee_light_out).get_max_power() * 100.0f;
    set_action:
      - lambda: id(govee_light_out).set_max_power(x / 100.0f);

# Reports what the current frame *wants* to draw, before limiting, as a
# fraction of the string's theoretical maximum. Above your max_power means
# the limiter is actively scaling the scene back.
sensor:
  - platform: template
    name: "LED Load"
    entity_category: diagnostic
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 5s
    lambda: return id(govee_light_out).get_load_fraction() * 100.0f;
